<svg xmlns="http://www.w3.org/2000/svg" width="110" height="155" viewBox="0 0 110 155">
  <!-- Stack depth illusion: back cards offset slightly -->
  <!-- Layer 5 (deepest) -->
  <rect x="14" y="10" width="86" height="120" rx="6" ry="6" fill="#c8a55a" stroke="#8b7140" stroke-width="0.8"/>
  <!-- Layer 4 -->
  <rect x="12" y="9" width="86" height="120" rx="6" ry="6" fill="#d4af63" stroke="#9a7e48" stroke-width="0.8"/>
  <!-- Layer 3 -->
  <rect x="10" y="7" width="86" height="120" rx="6" ry="6" fill="#dbb96e" stroke="#a08850" stroke-width="0.8"/>
  <!-- Layer 2 -->
  <rect x="8" y="5" width="86" height="120" rx="6" ry="6" fill="#e2c47a" stroke="#aa9255" stroke-width="0.8"/>
  <!-- Layer 1 (top card - styled like CardBack) -->
  <rect x="6" y="3" width="86" height="120" rx="6" ry="6" fill="#f0dbb0" stroke="#c8a96e" stroke-width="1.5"/>
  <!-- Top card diamond pattern inset -->
  <rect x="12" y="9" width="74" height="108" rx="4" ry="4" fill="#8b1a1a"/>
  <!-- Simple diamond crosshatch hint -->
  <rect x="12" y="9" width="74" height="108" rx="4" ry="4"
    fill="none" stroke="#f5d080" stroke-width="1.2"/>
  <rect x="15" y="12" width="68" height="102" rx="3" ry="3"
    fill="none" stroke="#e8b84b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <!-- Center spade on top card -->
  <circle cx="49" cy="63" r="16" fill="#6e1515" stroke="#f5d080" stroke-width="1.2"/>
  <path d="M49,52 C49,52 38,59 38,65 C38,70 42,72 46,71 C44,74 43,77 41,79 L57,79 C55,77 54,74 52,71 C56,72 60,70 60,65 C60,59 49,52 49,52 Z"
    fill="#f5d080"/>
  <!-- Top card border -->
  <rect x="6" y="3" width="86" height="120" rx="6" ry="6"
    fill="none" stroke="#8b7140" stroke-width="1"/>
  <!-- Drop shadow at bottom -->
  <ellipse cx="52" cy="148" rx="42" ry="6" fill="#000" opacity="0.18"/>
</svg>
