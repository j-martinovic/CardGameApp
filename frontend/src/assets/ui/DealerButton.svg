<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Outer rim -->
  <circle cx="30" cy="30" r="28" fill="#2c2c2c" stroke="#888" stroke-width="2"/>
  <!-- White button face -->
  <circle cx="30" cy="30" r="24" fill="#f5f0e0" stroke="#c8a96e" stroke-width="1.5"/>
  <!-- Inner ring decoration -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#c8a96e" stroke-width="0.75" stroke-dasharray="3,2"/>
  <!-- "D" letter -->
  <text x="30" y="37"
    font-family="Georgia, serif"
    font-size="22"
    font-weight="bold"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="1">D</text>
  <!-- Highlight glint -->
  <ellipse cx="22" cy="20" rx="5" ry="3" fill="white" opacity="0.35" transform="rotate(-30 22 20)"/>
</svg>
