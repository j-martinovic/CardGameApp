<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- $1 White chip -->
  <circle cx="30" cy="30" r="28" fill="#3a3a3a" stroke="#888" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="24" fill="#f0ece0" stroke="#ccc" stroke-width="1.5"/>
  <!-- Notch marks around rim (8 notches) -->
  <circle cx="30" cy="5"  r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="50" cy="13" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="55" cy="30" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="50" cy="47" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="30" cy="55" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="10" cy="47" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="5"  cy="30" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <circle cx="10" cy="13" r="3.5" fill="#f0ece0" stroke="#aaa" stroke-width="1"/>
  <!-- Inner face -->
  <circle cx="30" cy="30" r="18" fill="#e8e4d8" stroke="#bbb" stroke-width="1"/>
  <!-- Value text -->
  <text x="30" y="35" font-family="Georgia,serif" font-size="13" font-weight="bold"
    fill="#2c2c2c" text-anchor="middle">$1</text>
  <!-- Glint -->
  <ellipse cx="22" cy="20" rx="5" ry="3" fill="white" opacity="0.4" transform="rotate(-30 22 20)"/>
</svg>
