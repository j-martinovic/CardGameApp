<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- $100 Black chip -->
  <circle cx="30" cy="30" r="28" fill="#111" stroke="#555" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="24" fill="#2c2c2c" stroke="#666" stroke-width="1.5"/>
  <!-- Notch marks (8 notches, gold) -->
  <circle cx="30" cy="5"  r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="50" cy="13" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="55" cy="30" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="50" cy="47" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="30" cy="55" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="10" cy="47" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="5"  cy="30" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <circle cx="10" cy="13" r="3.5" fill="#2c2c2c" stroke="#c8a96e" stroke-width="1"/>
  <!-- Inner face -->
  <circle cx="30" cy="30" r="18" fill="#1a1a1a" stroke="#c8a96e" stroke-width="1"/>
  <!-- Value text -->
  <text x="30" y="35" font-family="Georgia,serif" font-size="10" font-weight="bold"
    fill="#c8a96e" text-anchor="middle">$100</text>
  <ellipse cx="22" cy="20" rx="5" ry="3" fill="white" opacity="0.25" transform="rotate(-30 22 20)"/>
</svg>
