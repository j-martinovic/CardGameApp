<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Avatar 2: Top hat, monocle, distinguished -->
  <!-- Top hat body -->
  <rect x="26" y="5" width="28" height="22" rx="3" ry="3" fill="#1a1a1a"/>
  <!-- Top hat brim -->
  <rect x="18" y="26" width="44" height="5" rx="2" ry="2" fill="#1a1a1a"/>
  <!-- Hat ribbon -->
  <rect x="26" y="23" width="28" height="4" fill="#8b1a1a"/>
  <!-- Face -->
  <circle cx="40" cy="52" r="22" fill="#f5d9a0"/>
  <circle cx="40" cy="52" r="22" fill="none" stroke="#c8a96e" stroke-width="1"/>
  <!-- Eyes -->
  <ellipse cx="33" cy="48" rx="4" ry="4.5" fill="white"/>
  <circle cx="34" cy="49" r="2.5" fill="#1a1a60"/>
  <ellipse cx="48" cy="48" rx="4" ry="4.5" fill="white"/>
  <circle cx="49" cy="49" r="2.5" fill="#1a1a60"/>
  <!-- Monocle on right eye -->
  <circle cx="48" cy="48" r="7" fill="none" stroke="#c8a96e" stroke-width="1.5"/>
  <line x1="54" y1="50" x2="57" y2="56" stroke="#c8a96e" stroke-width="1.5"/>
  <!-- Eyebrows (bushy) -->
  <path d="M29,42 Q33,40 37,42" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M44,42 Q48,40 52,42" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M40,52 Q38,56 36,57 Q40,59 44,57 Q42,56 40,52" fill="#c8a040" opacity="0.5"/>
  <!-- Smile / subtle smirk -->
  <path d="M34,61 Q40,65 46,62" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <!-- Moustache -->
  <path d="M34,59 Q37,57 40,59 Q43,57 46,59" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
</svg>
