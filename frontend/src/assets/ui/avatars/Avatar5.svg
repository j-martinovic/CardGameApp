<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Avatar 5: Glasses, bob haircut, bookish -->
  <!-- Hair (bob) -->
  <ellipse cx="40" cy="20" rx="24" ry="16" fill="#5c2a00"/>
  <rect x="16" y="18" width="48" height="20" fill="#5c2a00"/>
  <!-- Side hair -->
  <rect x="16" y="18" width="9" height="35" rx="4" ry="4" fill="#5c2a00"/>
  <rect x="55" y="18" width="9" height="35" rx="4" ry="4" fill="#5c2a00"/>
  <!-- Face -->
  <circle cx="40" cy="50" r="22" fill="#f5e0b0"/>
  <!-- Glasses frames -->
  <rect x="24" y="43" width="13" height="11" rx="5" ry="5" fill="none" stroke="#1a1a60" stroke-width="2"/>
  <rect x="43" y="43" width="13" height="11" rx="5" ry="5" fill="none" stroke="#1a1a60" stroke-width="2"/>
  <!-- Glasses bridge -->
  <line x1="37" y1="48" x2="43" y2="48" stroke="#1a1a60" stroke-width="2"/>
  <!-- Arms of glasses -->
  <line x1="24" y1="48" x2="19" y2="48" stroke="#1a1a60" stroke-width="2"/>
  <line x1="56" y1="48" x2="61" y2="48" stroke="#1a1a60" stroke-width="2"/>
  <!-- Eyes (behind glasses) -->
  <circle cx="30" cy="48" r="2.5" fill="#2a1a0a"/>
  <circle cx="49" cy="48" r="2.5" fill="#2a1a0a"/>
  <!-- Eyebrows -->
  <path d="M27,41 Q30,39 33,41" fill="none" stroke="#5c2a00" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M46,41 Q49,39 52,41" fill="none" stroke="#5c2a00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M40,52 Q38,55 40,56 Q42,55 40,52" fill="none" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle smile -->
  <path d="M35,61 Q40,65 45,61" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="29" cy="57" rx="5" ry="3" fill="#e88060" opacity="0.3"/>
  <ellipse cx="51" cy="57" rx="5" ry="3" fill="#e88060" opacity="0.3"/>
</svg>
