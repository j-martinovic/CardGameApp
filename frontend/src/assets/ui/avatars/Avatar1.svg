<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Avatar 1: Cowboy hat, friendly smile -->
  <!-- Hat brim -->
  <ellipse cx="40" cy="26" rx="26" ry="5" fill="#8b5e2a"/>
  <!-- Hat crown -->
  <rect x="25" y="8" width="30" height="20" rx="6" ry="6" fill="#8b5e2a"/>
  <rect x="25" y="8" width="30" height="4" rx="3" ry="3" fill="#a07035" opacity="0.5"/>
  <!-- Hat band -->
  <rect x="25" y="22" width="30" height="4" fill="#5c3c10"/>
  <!-- Face -->
  <circle cx="40" cy="48" r="22" fill="#f5c87a"/>
  <circle cx="40" cy="48" r="22" fill="none" stroke="#c8922a" stroke-width="1"/>
  <!-- Eyes -->
  <ellipse cx="32" cy="44" rx="4" ry="4.5" fill="white"/>
  <circle cx="33" cy="45" r="2.5" fill="#3a2010"/>
  <ellipse cx="48" cy="44" rx="4" ry="4.5" fill="white"/>
  <circle cx="49" cy="45" r="2.5" fill="#3a2010"/>
  <!-- Eyebrows -->
  <path d="M29,39 Q32,37 35,39" fill="none" stroke="#5c3c10" stroke-width="2" stroke-linecap="round"/>
  <path d="M45,39 Q48,37 51,39" fill="none" stroke="#5c3c10" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="40" cy="51" rx="3" ry="2" fill="#e0a85a" opacity="0.7"/>
  <!-- Smile -->
  <path d="M33,57 Q40,63 47,57" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="29" cy="54" rx="5" ry="3" fill="#e88060" opacity="0.35"/>
  <ellipse cx="51" cy="54" rx="5" ry="3" fill="#e88060" opacity="0.35"/>
</svg>
