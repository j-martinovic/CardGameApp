<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Avatar 4: Wild curly hair, big grin -->
  <!-- Curly hair blobs -->
  <circle cx="20" cy="28" r="12" fill="#3a1a00"/>
  <circle cx="28" cy="16" r="11" fill="#3a1a00"/>
  <circle cx="40" cy="12" r="12" fill="#3a1a00"/>
  <circle cx="52" cy="16" r="11" fill="#3a1a00"/>
  <circle cx="60" cy="28" r="12" fill="#3a1a00"/>
  <!-- Face -->
  <circle cx="40" cy="50" r="24" fill="#f5c87a"/>
  <!-- Hair bottom edge over face -->
  <rect x="16" y="26" width="48" height="14" fill="#3a1a00" rx="2" ry="2"/>
  <!-- Recolor face over hair bottom -->
  <ellipse cx="40" cy="43" rx="22" ry="10" fill="#f5c87a"/>
  <!-- Eyes (wide open) -->
  <ellipse cx="32" cy="46" rx="5" ry="5.5" fill="white"/>
  <circle cx="33" cy="47" r="3" fill="#1a1a60"/>
  <circle cx="34" cy="46" r="1" fill="white"/>
  <ellipse cx="48" cy="46" rx="5" ry="5.5" fill="white"/>
  <circle cx="49" cy="47" r="3" fill="#1a1a60"/>
  <circle cx="50" cy="46" r="1" fill="white"/>
  <!-- Eyebrows (raised) -->
  <path d="M27,40 Q32,37 37,40" fill="none" stroke="#3a1a00" stroke-width="2" stroke-linecap="round"/>
  <path d="M43,40 Q48,37 53,40" fill="none" stroke="#3a1a00" stroke-width="2" stroke-linecap="round"/>
  <!-- Big grin -->
  <path d="M30,58 Q40,68 50,58" fill="#8b1a1a"/>
  <path d="M30,58 Q40,68 50,58" fill="none" stroke="#5c0e0e" stroke-width="1.5"/>
  <!-- Teeth -->
  <path d="M33,58 Q40,65 47,58" fill="white"/>
  <!-- Nose -->
  <circle cx="40" cy="53" r="3.5" fill="#e0a85a" opacity="0.6"/>
</svg>
