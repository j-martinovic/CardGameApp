<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <!-- Subtle crosshatch texture to mimic woven felt -->
    <pattern id="felt-weave" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1a5c2a"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#1d6630" stroke-width="0.5" opacity="0.4"/>
      <line x1="8" y1="0" x2="0" y2="8" stroke="#174f23" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Radial vignette for depth -->
    <radialGradient id="felt-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0a2e10" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Oval table border highlight -->
    <radialGradient id="table-edge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#4a9a5e" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Base felt color -->
  <rect width="1200" height="800" fill="url(#felt-weave)"/>

  <!-- Vignette overlay -->
  <rect width="1200" height="800" fill="url(#felt-vignette)"/>

  <!-- Oval table outline (decorative) -->
  <ellipse cx="600" cy="400" rx="560" ry="360"
    fill="none" stroke="#2e7a42" stroke-width="3" opacity="0.6"/>
  <ellipse cx="600" cy="400" rx="548" ry="348"
    fill="none" stroke="#4a9a5e" stroke-width="1" opacity="0.35"/>

  <!-- Inner edge glow -->
  <rect width="1200" height="800" fill="url(#table-edge-glow)"/>
</svg>
